services:

  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_NAME: ihifix
      DB_USER: ihifix
      DB_PASSWORD: ihifixpassword
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ihifix
      POSTGRES_USER: ihifix
      POSTGRES_PASSWORD: ihifixpassword

